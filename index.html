<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💸 حساب باسل وهشام 💸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .fun { transition: all 0.18s ease; }
    .fun:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-200 via-purple-200 to-blue-200 min-h-screen flex flex-col items-center justify-center p-4">

  <h1 class="text-2xl font-bold mb-6 text-center">💸 حساب باسل وهشام 💸</h1>

  <!-- Debt Info -->
  <div class="bg-white bg-opacity-70 rounded-2xl shadow-xl p-6 w-full max-w-sm text-center mb-8">
    <p class="text-lg mb-2">المبلغ بينكما</p>
    <div id="debt" class="text-4xl font-bold">0</div>
    <p id="status" class="mt-2 text-lg"></p>
  </div>

  <!-- Buttons -->
  <div class="flex flex-col gap-6 w-full max-w-sm">
    <!-- Basil -->
    <div class="flex flex-col items-center bg-white bg-opacity-70 rounded-2xl shadow-md p-4">
      <div class="text-5xl">👦</div>
      <p class="mt-2 font-bold text-lg">باسل</p>
      <button onclick="updateDebt('Basil', 1)" class="fun mt-4 w-full py-3 bg-green-400 text-lg rounded-xl shadow">
        +1 رينجت
      </button>
    </div>

    <!-- Hesham -->
    <div class="flex flex-col items-center bg-white bg-opacity-70 rounded-2xl shadow-md p-4">
      <div class="text-5xl">👨</div>
      <p class="mt-2 font-bold text-lg">هشام</p>
      <button onclick="updateDebt('Hesham', 1)" class="fun mt-4 w-full py-3 bg-green-400 text-lg rounded-xl shadow">
        +1 رينجت
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_GoLS2VC3Tar2BcRCCHuRtqAsXP8mSoA",
      authDomain: "money-e63b7.firebaseapp.com",
      projectId: "money-e63b7",
      storageBucket: "money-e63b7.firebasestorage.app",
      messagingSenderId: "956017126533",
      appId: "1:956017126533:web:ab61f7bb5f87b7d9a14dec"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const debtRef = doc(db, "debts", "basil-hesham");

    async function initDebt() {
      const snap = await getDoc(debtRef);
      if (!snap.exists()) {
        await setDoc(debtRef, { balance: 0 });
      }
    }
    initDebt();

    onSnapshot(debtRef, (docSnap) => {
      if (docSnap.exists()) {
        const b = docSnap.data().balance ?? 0;
        render(b);
      } else {
        render(0);
      }
    });

    async function updateDebt(person, amount) {
      const snap = await getDoc(debtRef);
      let balance = 0;
      if (snap.exists()) {
        balance = snap.data().balance ?? 0;
      }
      if (person === 'Basil') balance += amount;
      else balance -= amount;
      await setDoc(debtRef, { balance });
    }

    window.updateDebt = updateDebt;

    function render(balance) {
      document.getElementById("debt").innerText = Math.abs(balance) + " رينجت";
      const status = document.getElementById("status");
      if (balance > 0) status.innerText = "هشام مدين لباسل";
      else if (balance < 0) status.innerText = "باسل مدين لهشام";
      else status.innerText = "🎉 الحساب صفر، لا ديون!";
    }
  </script>
</body>
</html>
