<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>💸 حساب باسل وهشام 💸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .fun { transition: all 0.18s ease; }
    .fun:active { transform: scale(0.98); }
  </style>
</head>
<body class="bg-gradient-to-r from-pink-200 via-purple-200 to-blue-200 min-h-screen flex flex-col justify-center items-center">
  <h1 class="text-3xl font-bold mb-6">💸 حساب باسل وهشام 💸</h1>

  <div class="flex items-center gap-12">
    <!-- Basil -->
    <div class="flex flex-col items-center">
      <div class="text-6xl">👦</div>
      <p class="mt-2 font-bold">باسل</p>
      <button onclick="updateDebt('Basil', 1)" class="fun mt-4 px-6 py-3 bg-green-400 rounded-2xl shadow text-lg">+1</button>
    </div>

    <!-- Debt Info -->
    <div class="text-center">
      <p class="text-xl mb-2">المبلغ بينكما</p>
      <div id="debt" class="text-4xl font-bold">0</div>
      <p id="status" class="mt-2 text-lg"></p>
    </div>

    <!-- Hesham -->
    <div class="flex flex-col items-center">
      <div class="text-6xl">👨</div>
      <p class="mt-2 font-bold">هشام</p>
      <button onclick="updateDebt('Hesham', 1)" class="fun mt-4 px-6 py-3 bg-green-400 rounded-2xl shadow text-lg">+1</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_GoLS2VC3Tar2BcRCCHuRtqAsXP8mSoA",
      authDomain: "money-e63b7.firebaseapp.com",
      projectId: "money-e63b7",
      storageBucket: "money-e63b7.firebasestorage.app",
      messagingSenderId: "956017126533",
      appId: "1:956017126533:web:ab61f7bb5f87b7d9a14dec"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const debtRef = doc(db, "debts", "basil-hesham");

    // إنشاء المستند إذا لم يكن موجود
    async function initDebt() {
      const snap = await getDoc(debtRef);
      if (!snap.exists()) {
        await setDoc(debtRef, { balance: 0 });
      }
    }
    initDebt();

    // استماع للتغييرات
    onSnapshot(debtRef, (docSnap) => {
      if (docSnap.exists()) {
        const b = docSnap.data().balance ?? 0;
        render(b);
      } else {
        render(0);
      }
    });

    // التحديث عند الضغط على الأزرار
    async function updateDebt(person, amount) {
      const snap = await getDoc(debtRef);
      let balance = 0;
      if (snap.exists()) {
        balance = snap.data().balance ?? 0;
      }
      if (person === 'Basil') balance += amount;
      else balance -= amount;

      await setDoc(debtRef, { balance });
    }

    // ربط الدالة مع الأزرار
    window.updateDebt = updateDebt;

    // عرض الحالة
    function render(balance) {
      document.getElementById("debt").innerText = Math.abs(balance) + " رينجت";
      const status = document.getElementById("status");
      if (balance > 0) status.innerText = "هشام مدين لباسل";
      else if (balance < 0) status.innerText = "باسل مدين لهشام";
      else status.innerText = "🎉 الحساب صفر، لا ديون!";
    }
  </script>
</body>
</html>
